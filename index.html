<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd1dc, #fff5f8);
  overflow: hidden;
}

.container {
  width: 92%;
  max-width: 430px;
  text-align: center;
}

.envelope {
  width: 280px;
  height: 180px;
  background: #ff6b91;
  margin: 0 auto 25px;
  position: relative;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 15px 35px rgba(0,0,0,.18);
}

.flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 140px solid transparent;
  border-right: 140px solid transparent;
  border-top: 100px solid #ff91aa;
}

.heart {
  position: absolute;
  top: 65px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 45px;
  z-index: 3;
}

.openBtn,
.yes,
.no {
  border: none;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.openBtn {
  background: #ff4f81;
  color: white;
}

.message {
  display: none;
  background: white;
  padding: 30px 20px;
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,.15);
}

.message h1 {
  color: #ff4f81;
  font-size: 30px;
}

.yes {
  background: #35c759;
  color: white;
  margin: 10px;
}

.no {
  background: #ff5252;
  color: white;
  margin: 10px;
  position: relative;
}

#result {
  display: none;
  margin-top: 25px;
  color: #ff4f81;
  font-size: 24px;
  font-weight: bold;
}

.angry {
  position: fixed;
  font-size: 45px;
  pointer-events: none;
  animation: angryAnim .8s ease-out forwards;
}

@keyframes angryAnim {
  0% {
    transform: scale(.5);
    opacity: 0;
  }

  50% {
    transform: scale(1.3);
    opacity: 1;
  }

  100% {
    transform: scale(1);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div id="envelopeScreen">

    <div class="envelope" onclick="openLetter()">
      <div class="flap"></div>
      <div class="heart">💌</div>
    </div>

    <h2>May something ako para sa'yo ❤️</h2>

    <button class="openBtn" onclick="openLetter()">
      Open 💌
    </button>

  </div>


  <div class="message" id="message">

    <h1>WILL YOU MARRY ME LOVEY? 💍❤️</h1>

    <button class="yes" onclick="sayYes()">
      YES ❤️
    </button>

    <button class="no" id="noButton" onclick="escapeNo()">
      NO ❌
    </button>

    <div id="result"></div>

  </div>

</div>


<script>

function openLetter() {

  document.getElementById("envelopeScreen").style.display = "none";
  document.getElementById("message").style.display = "block";

}


function sayYes() {

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML =
    "THANK YOU LOVE LOVE ❤️🥰💍";

  for (let i = 0; i < 40; i++) {

    const heart = document.createElement("div");

    heart.className = "angry";
    heart.innerHTML = "❤️";

    heart.style.left =
      Math.random() * 100 + "vw";

    heart.style.top =
      Math.random() * 100 + "vh";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 800);

  }

}


function escapeNo() {

  const button = document.getElementById("noButton");

  const maxX =
    window.innerWidth - button.offsetWidth - 20;

  const maxY =
    window.innerHeight - button.offsetHeight - 20;

  const x = Math.max(10, Math.random() * maxX);
  const y = Math.max(10, Math.random() * maxY);

  button.style.position = "fixed";
  button.style.left = x + "px";
  button.style.top = y + "px";


  // Angry reactions
  for (let i = 0; i < 3; i++) {

    const angry = document.createElement("div");

    angry.className = "angry";
    angry.innerHTML = "😡";

    angry.style.left =
      Math.random() * 90 + "vw";

    angry.style.top =
      Math.random() * 80 + "vh";

    document.body.appendChild(angry);

    setTimeout(() => {
      angry.remove();
    }, 800);

  }

}

</script>

</body>
</html>
